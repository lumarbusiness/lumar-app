<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LUMAR</title>
  <meta name="theme-color" content="#14130f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUMAR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Inloggen -->
  <section id="auth" class="auth" hidden>
    <form id="loginForm" class="auth-card">
      <div class="wordmark">LUMAR<span>Watches</span></div>
      <p class="muted" id="authHint">Log in met je eigen account.</p>
      <label>E-mailadres<input name="email" type="email" autocomplete="username" required></label>
      <label>Wachtwoord<input name="password" type="password" autocomplete="current-password"></label>
      <button class="btn primary wide" type="submit">Inloggen</button>
      <p class="auth-status" id="authStatus" role="status"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="sidebar" id="sidebar"></aside>
    <header class="mtop" id="mtop"></header>
    <main id="main" class="main"></main>
    <nav class="mbar" id="mbar" aria-label="Apps"></nav>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
